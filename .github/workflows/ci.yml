name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/runtime/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (full suite, incl. trigger filter)
        run: npm test
      - name: Trigger syntax
        working-directory: src/trigger
        run: |
          node --check index.mjs
          node --check filter.mjs
      - name: Script syntax
        working-directory: .
        run: bash -n infra/scripts/*.sh e2e/*.sh
