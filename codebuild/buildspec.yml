# Executor job: runs Claude Code against the target repo with an approved plan,
# verifies tests, pushes a branch, and opens a PR.
#
# Inputs (via StartBuild environmentVariablesOverride):
#   ISSUE_ID     e.g. "HOT-50"           — Linear identifier, used in branch/PR naming
#   ISSUE_TITLE  e.g. "Counterparty..."  — used in the PR title
#   ISSUE_URL    Linear issue URL        — linked in the PR body
#   PLAN_S3_URI  s3://<bucket>/plans/... — the approved plan (markdown)
#
# Outputs (exported variables, readable via BatchGetBuilds):
#   PR_URL, PR_NUMBER, AGENT_RESULT
#
# Claude Code authenticates to Bedrock with this build's IAM role — no API key.
# --dangerously-skip-permissions is acceptable here because the CodeBuild
# container is ephemeral and isolated, and the git push/PR steps below are the
# only paths out of it.
version: 0.2

env:
  variables:
    REPO: "hotstone/etrmfactory"
    CLAUDE_CODE_USE_BEDROCK: "1"
    ANTHROPIC_MODEL: "au.anthropic.claude-opus-4-6-v1"
    ANTHROPIC_SMALL_FAST_MODEL: "au.anthropic.claude-haiku-4-5-20251001-v1:0"
    WORKSPACE: "/tmp/workspace"
    # CodeBuild containers run as root; the container is an ephemeral sandbox,
    # so allow --dangerously-skip-permissions under root.
    IS_SANDBOX: "1"
  exported-variables:
    - PR_URL
    - PR_NUMBER
    - AGENT_RESULT

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - npm install -g @anthropic-ai/claude-code
      - claude --version

  pre_build:
    commands:
      - export GITHUB_TOKEN=$(aws secretsmanager get-secret-value --secret-id prod/github/pat --query SecretString --output text)
      - export BRANCH="agent/${ISSUE_ID}"
      - git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" "$WORKSPACE"
      - cd "$WORKSPACE" && git checkout -b "$BRANCH"
      - cd "$WORKSPACE" && npm ci
      - aws s3 cp "$PLAN_S3_URI" /tmp/plan.md
      # Compose the prompt: fixed instructions + the approved plan.
      - |
        cat > /tmp/prompt.md <<'INSTRUCTIONS'
        Implement the plan below in this repository. Follow the conventions in
        CLAUDE.md. Add or update tests for every behavior change. Run the test
        suite and typecheck, and keep iterating until both pass. Do not commit,
        push, or touch git config — the harness handles git. Do not modify
        files outside what the plan requires.

        --- PLAN ---
        INSTRUCTIONS
      - cat /tmp/plan.md >> /tmp/prompt.md
      # PR-creation helper: reads inputs from the environment (quote-safe) and
      # writes PR_URL/PR_NUMBER to /tmp/pr.env for the build phase to source.
      - |
        cat > /tmp/create_pr.py <<'PYEOF'
        import json, os, urllib.request

        payload = {
            "title": f"{os.environ['ISSUE_ID']}: {os.environ['ISSUE_TITLE']}",
            "head": os.environ["BRANCH"],
            "base": "main",
            "body": (
                f"Automated implementation of [{os.environ['ISSUE_ID']}]({os.environ['ISSUE_URL']}).\n\n"
                f"Generated by the etrm-factory agent pipeline; typecheck and tests "
                f"passed in CodeBuild run `{os.environ['CODEBUILD_BUILD_ID']}`."
            ),
        }
        req = urllib.request.Request(
            f"https://api.github.com/repos/{os.environ['REPO']}/pulls",
            data=json.dumps(payload).encode(),
            headers={
                "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                "Accept": "application/vnd.github+json",
                "Content-Type": "application/json",
            },
        )
        with urllib.request.urlopen(req) as resp:
            pr = json.load(resp)
        print(f"PR created: {pr['html_url']}")
        with open("/tmp/pr.env", "w") as f:
            f.write(f"export PR_URL={pr['html_url']}\nexport PR_NUMBER={pr['number']}\n")
        PYEOF

  build:
    commands:
      # 1. Let Claude Code implement the plan.
      # (No pipe here: CodeBuild's shell is dash, which has no pipefail — redirect
      # preserves Claude Code's exit status, then print the result for the log.)
      - cd "$WORKSPACE" && claude -p "$(cat /tmp/prompt.md)" --output-format json --dangerously-skip-permissions > /tmp/claude-output.json
      - cat /tmp/claude-output.json
      # 2. Hard gates, independent of what Claude reports: changes exist, types check, tests pass.
      - cd "$WORKSPACE" && test -n "$(git status --porcelain)" || { echo "FAIL - Claude Code made no changes"; exit 1; }
      - cd "$WORKSPACE" && npm run typecheck
      - cd "$WORKSPACE" && npm test
      # 3. Commit and push.
      - cd "$WORKSPACE" && git config user.name "etrm-factory-agent" && git config user.email "agent@users.noreply.github.com"
      - 'cd "$WORKSPACE" && git add -A && git commit -m "${ISSUE_ID}: ${ISSUE_TITLE}" -m "Automated implementation. Plan and review trail on ${ISSUE_URL}"'
      - cd "$WORKSPACE" && git push origin "$BRANCH"
      # 4. Open the PR via the GitHub REST API (script written in pre_build).
      - python3 /tmp/create_pr.py
      - . /tmp/pr.env && export AGENT_RESULT="success" && echo "PR_URL=$PR_URL PR_NUMBER=$PR_NUMBER"

  post_build:
    commands:
      # Archive the Claude Code transcript summary next to the plan for debugging.
      - aws s3 cp /tmp/claude-output.json "${PLAN_S3_URI%.md}-claude-output.json" || true
